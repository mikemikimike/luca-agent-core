name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # app/config.py asserts a key at import time; this dummy value is never used to call Gemini
      GOOGLE_API_KEY: ci-dummy-key-0000000000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff check .

      - name: Tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Import and tool-registry check
        run: |
          uv run python -c "
          from app.main import app
          from app.tools.registry import registry
          assert {'get_weather_forecast', 'calculate_metric'} <= set(registry.list_tools()), registry.list_tools()
          print('OK:', registry.list_tools())
          "

      - name: Docker build
        run: docker build -t luca-agent-core .
